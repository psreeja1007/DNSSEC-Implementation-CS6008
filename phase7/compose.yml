name: cs6008-phase7

networks:
  client_net:
    driver: bridge
    ipam: { config: [{ subnet: 172.16.1.0/24 }] }
  resolver_net:
    driver: bridge
    ipam: { config: [{ subnet: 172.16.2.0/24 }] }
  auth_net:
    driver: bridge
    ipam: { config: [{ subnet: 172.16.3.0/24 }] }

services:

  root-ns:
    build: ./root-ns
    container_name: root-ns
    hostname: root-ns
    cap_add: [NET_ADMIN]
    security_opt: [ "apparmor:unconfined" ]
    networks: { auth_net: { ipv4_address: 172.16.3.10 } }
    volumes: [ "./common/pki:/pki" ]
    tty: true

  tld-ns:
    build: ./tld-ns
    container_name: tld-ns
    hostname: tld-ns
    cap_add: [NET_ADMIN]
    security_opt: [ "apparmor:unconfined" ]
    networks: { auth_net: { ipv4_address: 172.16.3.20 } }
    volumes: [ "./common/pki:/pki" ]
    tty: true

  domain-ns:
    build: ./domain-ns
    container_name: domain-ns
    hostname: domain-ns
    cap_add: [NET_ADMIN]
    security_opt: [ "apparmor:unconfined" ]
    networks: { auth_net: { ipv4_address: 172.16.3.30 } }
    volumes: [ "./common/pki:/pki" ]
    tty: true

  resolver:
    build: ./resolver
    container_name: resolver
    hostname: resolver
    cap_add: [NET_ADMIN]
    security_opt: [ "apparmor:unconfined" ]
    networks: { resolver_net: { ipv4_address: 172.16.2.10 } }
    volumes: [ "./common/pki:/pki" ]
    tty: true

  # Client A — REFUSES cleartext (strict DoT). Reaches resolver by name only.
  client:
    build: ./client
    container_name: client
    hostname: client
    cap_add: [NET_ADMIN]
    extra_hosts: [ "resolver.cs6008.local:172.16.2.10" ]
    networks: { client_net: { ipv4_address: 172.16.1.10 } }
    volumes: [ "./common/pki:/pki:ro" ]
    tty: true

  # Client B — PERMITS cleartext fallback (opportunistic).
  client-b:
    build: ./client-b
    container_name: client-b
    hostname: client-b
    cap_add: [NET_ADMIN]
    extra_hosts: [ "resolver.cs6008.local:172.16.2.10" ]
    networks: { client_net: { ipv4_address: 172.16.1.11 } }
    volumes: [ "./common/pki:/pki:ro" ]
    tty: true

  webserver:
    build: ./webserver
    container_name: webserver
    hostname: webserver
    networks: { client_net: { ipv4_address: 172.16.1.20 } }
    tty: true

  # Edge-router: forwards client<->resolver, and installs the per-attack
  # last-mile diversion driven by ATTACK (none|alter|rogue-cert|block).
  edge-router:
    build: ./edge-router
    container_name: edge-router
    hostname: edge-router
    cap_add: [NET_ADMIN]
    environment:
      - ATTACK=${ATTACK:-none}
      - ATTACKER_IP=172.16.1.100
      - DIVERT_CLIENTS=172.16.1.10 172.16.1.11
    sysctls: { net.ipv4.ip_forward: "1" }
    networks:
      client_net:   { ipv4_address: 172.16.1.2 }
      resolver_net: { ipv4_address: 172.16.2.2 }
    tty: true

  core-router:
    build: ./core-router
    container_name: core-router
    hostname: core-router
    cap_add: [NET_ADMIN]
    sysctls: { net.ipv4.ip_forward: "1" }
    networks:
      resolver_net: { ipv4_address: 172.16.2.3 }
      auth_net:     { ipv4_address: 172.16.3.3 }
    tty: true

  rogue-web:
    build: ./rogue-web
    container_name: rogue-web
    hostname: rogue-web
    networks: { client_net: { ipv4_address: 172.16.1.30 } }
    tty: true

  # Attacker on the client subnet. Runs the libpcap interceptor and, for the
  # rogue-cert attack, a TLS server with an untrusted certificate.
  attacker:
    build: ./attacker
    container_name: attacker
    hostname: attacker
    cap_add: [NET_RAW, NET_ADMIN]
    sysctls: { net.ipv4.ip_forward: "0" }
    environment:
      - ATTACK=${ATTACK:-none}
      - ATTACKER_IP=172.16.1.100
      - CLIENT_IPS=172.16.1.10,172.16.1.11
    networks: { client_net: { ipv4_address: 172.16.1.100 } }
    tty: true
