key "rndc-key" {
    algorithm hmac-sha256;
    secret "7X2qQvC9m0J5k9n3H8aQyS5bQmR0gq+NcT6AW+4cQ+4=";
};

controls {
    inet 127.0.0.1 port 953 allow { 127.0.0.1; } keys { "rndc-key"; };
};

include "/etc/bind/trust-anchor.conf";

// TLS identity for the encrypted last mile (DoT/DoH). The cert is issued by
// the lab private CA with SAN DNS:resolver.cs6008.local (no IP SAN); the key
// and cert are generated at container start (see entrypoint.sh) and never
// committed.
tls resolver-tls {
    key-file "/etc/bind/certs/resolver.key";
    cert-file "/etc/bind/certs/resolver.cert.pem";
};

// DoH endpoint path.
http resolver-http {
    endpoints { "/dns-query"; };
};

options {
    directory "/var/cache/bind";
    recursion yes;

    // Cleartext Do53 stays listening so we can model a client that TOLERATES
    // a downgrade to cleartext. A client that refuses cleartext simply never
    // uses it.
    listen-on port 53  { any; };

    // DoT and DoH on the encrypted last mile.
    listen-on port 853 tls resolver-tls               { any; };   // DoT
    listen-on port 443 tls resolver-tls http resolver-http { any; };   // DoH

    listen-on-v6 { none; };

    allow-query     { 172.16.1.0/24; 172.16.2.0/24; localhost; };
    allow-recursion { 172.16.1.0/24; 172.16.2.0/24; localhost; };
    allow-transfer  { none; };

    dnssec-validation yes;   // upstream validation unchanged from Phase 3
};

zone "." {
    type hint;
    file "/etc/bind/root.hints";
};
