key "rndc-key" {
    algorithm hmac-sha256;
    secret "7X2qQvC9m0J5k9n3H8aQyS5bQmR0gq+NcT6AW+4cQ+4=";
};

controls {
    inet 127.0.0.1 port 953 allow { 127.0.0.1; } keys { "rndc-key"; };
};

// Written by entrypoint.sh at container start from root-ns's published KSK
// (/pki/root.key) -- defines the "." trust-anchors clause used below.
include "/etc/bind/trust-anchor.conf";

options {
    directory "/var/cache/bind";
    recursion yes;
    listen-on { any; };
    listen-on-v6 { none; };
    allow-query { 172.16.1.0/24; 172.16.2.0/24; localhost; };
    allow-recursion { 172.16.1.0/24; 172.16.2.0/24; localhost; };
    allow-transfer { none; };

    // Phase 3: validate against the "." trust anchor from trust-anchor.conf
    dnssec-validation yes;
};

zone "." {
    type hint;
    file "/etc/bind/root.hints";
};